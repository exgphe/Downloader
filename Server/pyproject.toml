[project]
name = "downloader-video-service"
version = "0.1.0"
description = "Authenticated Instagram and X video resolver for the Safari Downloader extension"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.9.26"]

[project.scripts]
downloader-video-service = "downloader_video_service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/downloader_video_service"]
