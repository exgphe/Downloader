<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloader</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true"><img src="images/icon-96.png" width="43" height="43" alt=""></div>
    <div><h1>Downloader</h1><p class="subtitle" data-i18n="popupSubtitle"></p></div>
  </header>
  <p class="intro" data-i18n="popupInstruction"></p>
  <section class="status-card" aria-labelledby="photos-title">
    <div class="status-dot" id="photos-dot" aria-hidden="true"></div>
    <div><h2 id="photos-title" data-i18n="photosLibrary"></h2><p id="photos-status" role="status" data-i18n="checkingStatus"></p></div>
  </section>
  <section class="status-card" aria-labelledby="video-title">
    <div class="status-dot" id="video-dot" aria-hidden="true"></div>
    <div><h2 id="video-title" data-i18n="videoEngine"></h2><p id="video-status" role="status" data-i18n="checkingStatus"></p></div>
  </section>
  <p class="description" data-i18n="videoExplanation"></p>
  <section class="session-card" aria-labelledby="instagram-title">
    <h2 id="instagram-title" data-i18n="instagramLogin"></h2>
    <p class="session-note" data-i18n="instagramSessionNote"></p>
    <p id="instagram-status" role="status" data-i18n="checkingStatus"></p>
    <div class="session-actions">
      <button id="sync-instagram" type="button" data-i18n="syncInstagramSession"></button>
      <button id="forget-instagram" type="button" data-i18n="forgetInstagramSession"></button>
    </div>
    <p id="instagram-error" role="alert" hidden></p>
  </section>
  <footer data-i18n="footerNote"></footer>
</body>
</html>
