<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloader</title>
  <link rel="stylesheet" href="popup.css">
  <script src="media-core.js"></script>
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></div>
    <div><h1>Downloader</h1><p class="subtitle" data-i18n="popupSubtitle"></p></div>
  </header>
  <p class="intro" data-i18n="popupInstruction"></p>
  <section class="photos-card" aria-labelledby="photos-title">
    <div class="status-dot" id="photos-dot" aria-hidden="true"></div>
    <div><h2 id="photos-title" data-i18n="photosLibrary"></h2><p id="photos-status" role="status" data-i18n="checkingStatus"></p></div>
  </section>
  <form id="settings-form">
    <h2 data-i18n="videoService"></h2>
    <p class="description" data-i18n="serviceExplanation"></p>
    <label for="resolver-url" data-i18n="serviceURL"></label>
    <input id="resolver-url" type="url" placeholder="https://downloader.example.com" autocomplete="url" spellcheck="false" autocapitalize="none">
    <label for="resolver-token" data-i18n="accessToken"></label>
    <input id="resolver-token" type="password" autocomplete="off" spellcheck="false" autocapitalize="none">
    <p class="hint" data-i18n="tokenPrivacy"></p>
    <button id="save" type="submit" data-i18n="saveSettings"></button>
    <p id="settings-status" role="status" aria-live="polite"></p>
  </form>
  <footer data-i18n="footerNote"></footer>
</body>
</html>
